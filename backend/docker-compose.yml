services:
  redis:
    image: redis:7-alpine
    container_name: flowcv-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
    container_name: flowcv-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      IMPORT_MAX_FILE_SIZE_BYTES: ${IMPORT_MAX_FILE_SIZE_BYTES:-10485760}
      IMPORT_MAX_ARCHIVE_EXPANDED_BYTES: ${IMPORT_MAX_ARCHIVE_EXPANDED_BYTES:-52428800}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-30000}
      REDIS_URL: redis://redis:6379/0
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-2}
      AI_RATE_LIMIT_ENABLED: ${AI_RATE_LIMIT_ENABLED:-true}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-10}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-50}
      AI_JD_ANALYSIS_PER_HOUR: ${AI_JD_ANALYSIS_PER_HOUR:-10}
      AI_ATS_ANALYSIS_PER_HOUR: ${AI_ATS_ANALYSIS_PER_HOUR:-10}
      AI_TAILORING_PER_HOUR: ${AI_TAILORING_PER_HOUR:-5}
      AI_CACHE_ENABLED: ${AI_CACHE_ENABLED:-true}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-300}
      AI_PROVIDER_HEALTH_TTL_SECONDS: ${AI_PROVIDER_HEALTH_TTL_SECONDS:-900}
      AI_PROVIDER_COOLDOWN_SECONDS: ${AI_PROVIDER_COOLDOWN_SECONDS:-60}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-262144}
      AI_MAX_RESUME_BYTES: ${AI_MAX_RESUME_BYTES:-131072}
      AI_MAX_RESUME_TEXT_CHARS: ${AI_MAX_RESUME_TEXT_CHARS:-60000}
      AI_MAX_JD_CHARS: ${AI_MAX_JD_CHARS:-20000}
      AI_MAX_OPERATIONS: ${AI_MAX_OPERATIONS:-10}
      AI_MAX_OUTPUT_CHARS: ${AI_MAX_OUTPUT_CHARS:-30000}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-v1}
      AI_IDENTITY_SECRET: ${AI_IDENTITY_SECRET:-development-anonymous-rate-limit-secret}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      TRUSTED_PROXY_HOSTS: '${TRUSTED_PROXY_HOSTS:-["127.0.0.1","::1"]}'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:3000}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-FlowCV}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
